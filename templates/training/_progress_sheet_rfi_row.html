{% macro progress_sheet_rfi_row(aspect, rfi_value, severity_value, action_value, comment_value, rfi_options) -%}
{% set cur = (rfi_value or '')|trim %}
<tr class="data-row">
    <td>
        <select class="form-select form-select-sm" name="{{ aspect }}_rfi">
            <option value="">—</option>
            {% if cur and cur not in rfi_options %}
            <option value="{{ cur }}" selected>{{ cur }} (saved)</option>
            {% endif %}
            {% for opt in rfi_options %}
            <option value="{{ opt }}" {{ 'selected' if cur == opt }}>{{ opt }}</option>
            {% endfor %}
        </select>
    </td>
    <td>
        <select class="form-select form-select-sm" name="{{ aspect }}_severity">
            <option value="">—</option>
            <option value="Red" {{ 'selected' if severity_value == 'Red' }}>Red</option>
            <option value="Yellow" {{ 'selected' if severity_value == 'Yellow' }}>Yellow</option>
            <option value="Green" {{ 'selected' if severity_value == 'Green' }}>Green</option>
        </select>
    </td>
    <td><textarea class="form-control form-control-sm" name="{{ aspect }}_action" rows="1">{{ action_value or '' }}</textarea></td>
    <td><textarea class="form-control form-control-sm" name="{{ aspect }}_comment" rows="1">{{ comment_value or '' }}</textarea></td>
</tr>
{%- endmacro %}
