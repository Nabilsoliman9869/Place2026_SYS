{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('training_index') }}">Training</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('wave_details', wave_id=student.BatchID) }}">{{ student.BatchName }}</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('wave_progress_sheets', wave_id=student.BatchID) }}">Progress sheets</a></li>
      <li class="breadcrumb-item active">SSR & Initial FB</li>
    </ol>
  </nav>

  <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div>
      <h2 class="mb-1"><i class="fas fa-clipboard-check text-warning"></i> SSR & Initial FB</h2>
      <p class="text-muted mb-0">{{ student.FullName }} — {{ student.CourseName }}</p>
      <p class="small text-secondary mb-0">نموذج للمدرب: كويز/SSR وملاحظات أولية لكل أسبوع.</p>
    </div>
    <form method="get" class="d-flex align-items-center gap-2">
      <label class="form-label mb-0">Week</label>
      <input type="number" name="week" class="form-control form-control-sm" style="width:5rem" min="1" max="52" value="{{ week }}">
      <button type="submit" class="btn btn-sm btn-outline-primary">Go</button>
    </form>
  </div>

  <form method="post" data-turbo="false" class="card shadow-sm">
    <div class="card-body">
      <input type="hidden" name="week_number" value="{{ week }}">

      <div class="row g-3">
        <div class="col-lg-8">
          <label class="form-label fw-bold">SSR (Summary / Skills / Result)</label>
          <textarea name="ssr" class="form-control" rows="6" placeholder="اكتب ملخص الأداء/النتيجة/المهارات...">{{ row.SSR or '' }}</textarea>
        </div>
        <div class="col-lg-4">
          <label class="form-label fw-bold">Quiz score</label>
          <input type="number" step="0.01" min="0" max="100" name="quiz_score" class="form-control" value="{{ row.QuizScore if row.QuizScore is not none else '' }}" placeholder="مثال: 78">
          <div class="mt-3">
            <label class="form-label fw-bold">Quiz notes</label>
            <textarea name="quiz_notes" class="form-control" rows="5" placeholder="تفاصيل الكويز/أخطاء شائعة...">{{ row.QuizNotes or '' }}</textarea>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label fw-bold">Initial feedback (ملاحظات أولية)</label>
          <textarea name="initial_feedback" class="form-control" rows="4" placeholder="ملاحظات عامة للمتدرب + خطة أولية...">{{ row.InitialFeedback or '' }}</textarea>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <a href="{{ url_for('wave_progress_sheets', wave_id=student.BatchID) }}" class="btn btn-outline-secondary">Back to list</a>
        <button type="submit" class="btn btn-warning"><i class="fas fa-save"></i> Save SSR & FB (week {{ week }})</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
