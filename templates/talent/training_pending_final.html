{% extends 'base.html' %}
{% block content %}
<div class="container-fluid mt-3">
    <h2 class="h4"><span class="en-bold">Pending</span> <span class="ar-normal text-muted">— قيد التقييم النهائي (مختبر التدريب)</span></h2>
    <div class="table-responsive">
        <table class="table table-sm table-hover" id="pendTable">
            <thead class="table-light">
                <tr>
                    <th><input type="text" class="form-control form-control-sm pf" placeholder="Filter name" data-i="0"></th>
                    <th><input type="text" class="form-control form-control-sm pf" placeholder="Filter phone" data-i="1"></th>
                </tr>
                <tr><th>Name</th><th>Phone</th><th>Profile</th></tr>
            </thead>
            <tbody>
                {% for r in rows %}
                <tr>
                    <td>{{ r.FullName }}</td>
                    <td>{{ r.Phone }}</td>
                    <td><a href="{{ url_for('candidate_profile', candidate_id=r.CandidateID) }}" target="_blank" rel="noopener">Open</a></td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="text-center text-muted py-4">No pending evaluations.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<script>
(function(){
  const t = document.getElementById('pendTable');
  if (!t) return;
  t.querySelectorAll('.pf').forEach(inp => inp.addEventListener('input', function(){
    const idx = +this.dataset.i;
    const q = (this.value||'').toLowerCase();
    t.querySelectorAll('tbody tr').forEach(tr => {
      const td = tr.querySelectorAll('td');
      if (!td.length) return;
      tr.style.display = !q || (td[idx] && td[idx].textContent.toLowerCase().includes(q)) ? '' : 'none';
    });
  }));
})();
</script>
{% endblock %}
